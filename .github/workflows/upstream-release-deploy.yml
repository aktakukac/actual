name: Deploy upstream Actual release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: Retry the latest release after a failed deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: actual-fly-production-deploy
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find the latest stable upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        shell: bash
        run: |
          set -euo pipefail

          release_tag="$(gh api repos/actualbudget/actual/releases/latest --jq .tag_name)"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected upstream stable release tag: $release_tag"
            exit 1
          fi

          ref_exists() {
            local ref
            if ref="$(git ls-remote --refs --exit-code origin "$1")"; then
              return 0
            else
              local status=$?
              if [[ "$status" -eq 2 ]]; then
                return 1
              fi
              return "$status"
            fi
          }

          if ref_exists "refs/tags/fly-deployed/$release_tag"; then
            echo "Release $release_tag is already deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif ref_exists "refs/tags/fly-failed/$release_tag"; then
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "$RETRY_FAILED" == "true" ]]; then
              echo "Retrying previously failed release $release_tag."
              echo "deploy=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Release $release_tag previously failed. Dispatch this workflow with retry_failed enabled after reviewing the failure."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release $release_tag has not been deployed."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

  build-candidate:
    needs: detect
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check out the pinned upstream release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: actualbudget/actual
          ref: ${{ needs.detect.outputs.release_tag }}
          path: upstream
          persist-credentials: false

      - name: Add the production backup integration
        run: |
          cp sync-server.Dockerfile backup-capture.cjs backup-supervisor.cjs backup-trigger.cjs backup-upload.cjs fly.toml upstream/

      - name: Build the pinned candidate image
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/actualbudget/actual" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --tag "actual-fly-candidate:$RELEASE_TAG" \
            --file upstream/sync-server.Dockerfile \
            upstream

      - name: Smoke-test candidate with network access blocked
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm --force actual-fly-candidate >/dev/null 2>&1 || true' EXIT

          image="actual-fly-candidate:$RELEASE_TAG"
          docker run --detach --network none --name actual-fly-candidate \
            --env ACTUAL_HOSTNAME=0.0.0.0 \
            --env ACTUAL_PORT=5006 \
            --env ACTUAL_DATA_DIR=/tmp \
            --env ACTUAL_SERVER_FILES=/tmp \
            --env ACTUAL_USER_FILES=/tmp \
            "$image"

          for attempt in $(seq 1 60); do
            if docker exec actual-fly-candidate node -e \
              'fetch("http://127.0.0.1:5006/health").then(async response => { const body = await response.json(); if (!response.ok || body.status !== "UP") process.exit(1); }).catch(() => process.exit(1))' \
              >/dev/null 2>&1; then
              echo "The isolated candidate returned a healthy response."
              docker save "$image" | gzip -1 > "$RUNNER_TEMP/actual-fly-candidate.tar.gz"
              exit 0
            fi
            sleep 2
          done

          docker logs actual-fly-candidate
          echo "::error::The isolated candidate did not pass its health check."
          exit 1

      - name: Upload the tested image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: actual-fly-candidate-${{ needs.detect.outputs.release_tag }}
          path: ${{ runner.temp }}/actual-fly-candidate.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Summarize the candidate for production approval
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
        run: |
          {
            echo "### Production deployment candidate"
            echo
            echo "- Upstream release: [\`$RELEASE_TAG\`](https://github.com/actualbudget/actual/releases/tag/$RELEASE_TAG)"
            echo "- Candidate smoke test: passed with container network access disabled."
            echo "- Before approval: confirm the latest backup and required isolated restore validation."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [detect, build-candidate]
    if: needs.detect.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download the tested candidate image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: actual-fly-candidate-${{ needs.detect.outputs.release_tag }}
          path: ${{ runner.temp }}/candidate

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # setup-flyctl
        with:
          version: 0.4.120

      - name: Verify the deploy credential is configured
        env:
          FLY_DEPLOY_API_TOKEN: ${{ secrets.FLY_DEPLOY_API_TOKEN }}
        run: |
          if [[ -z "$FLY_DEPLOY_API_TOKEN" ]]; then
            echo "::error::Configure FLY_DEPLOY_API_TOKEN in the protected production environment before approving a deployment."
            exit 1
          fi

      - name: Load the tested image and authenticate with Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_API_TOKEN }}
        run: |
          docker load --input "$RUNNER_TEMP/candidate/actual-fly-candidate.tar.gz"
          flyctl auth docker

      - name: Capture the current production image
        id: previous-image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_API_TOKEN }}
          FLY_APP: actual-gm-budget-2026
        shell: bash
        run: |
          set -euo pipefail
          image="$(flyctl machine list --app "$FLY_APP" --json | jq -er \
            '[.[] | select(.state == "started") | .config.image] | unique | if length == 1 then .[0] else error("Expected one unique image across started machines") end')"

          if [[ "$image" != "registry.fly.io/$FLY_APP:"* && "$image" != "registry.fly.io/$FLY_APP@"* ]]; then
            echo "::error::The current Fly image reference is not from this app's registry: $image"
            exit 1
          fi

          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Push and deploy the tested image
        id: deploy-image
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          FLY_APP: actual-gm-budget-2026
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image="registry.fly.io/$FLY_APP:upstream-$RELEASE_TAG"
          docker tag "actual-fly-candidate:$RELEASE_TAG" "$image"
          docker push "$image"
          flyctl deploy --app "$FLY_APP" --config fly.toml --image "$image" --strategy rolling --yes

      - name: Verify production health
        id: verify-health
        env:
          FLY_APP: actual-gm-budget-2026
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if response="$(curl --fail --silent --max-time 10 "https://$FLY_APP.fly.dev/health")" \
              && jq -e '.status == "UP"' <<< "$response" >/dev/null; then
              echo "Production health check passed."
              exit 0
            fi
            sleep 5
          done

          echo "::error::Production did not return a healthy response after deployment."
          exit 1

      - name: Restore the previous image after a failed deployment
        if: failure() && steps.previous-image.outcome == 'success'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_API_TOKEN }}
          FLY_APP: actual-gm-budget-2026
          PREVIOUS_IMAGE: ${{ steps.previous-image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Restoring the previous production image."
          flyctl deploy --app "$FLY_APP" --config fly.toml --image "$PREVIOUS_IMAGE" --strategy rolling --yes

          for attempt in $(seq 1 18); do
            if response="$(curl --fail --silent --max-time 10 "https://$FLY_APP.fly.dev/health")" \
              && jq -e '.status == "UP"' <<< "$response" >/dev/null; then
              echo "The previous production image is healthy again."
              exit 1
            fi
            sleep 5
          done

          echo "::error::The previous image was redeployed but did not pass the health check."
          exit 1

  mark-deployed:
    needs: [detect, deploy]
    if: needs.detect.outputs.deploy == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record the successfully deployed upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/fly-deployed/$RELEASE_TAG" \
            -f "sha=$COMMIT_SHA"

  mark-failed:
    needs: [detect, build-candidate, deploy]
    if: >-
      always()
      && needs.detect.outputs.deploy == 'true'
      && (needs.build-candidate.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Record the failed upstream release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ref="refs/tags/fly-failed/$RELEASE_TAG"
          get_endpoint="repos/$GITHUB_REPOSITORY/git/ref/tags/fly-failed/$RELEASE_TAG"
          patch_endpoint="repos/$GITHUB_REPOSITORY/git/refs/tags/fly-failed/$RELEASE_TAG"

          if gh api "$get_endpoint" >/dev/null 2>&1; then
            gh api --method PATCH "$patch_endpoint" -F "sha=$COMMIT_SHA" -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=$ref" \
              -f "sha=$COMMIT_SHA"
          fi
