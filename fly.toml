app = "actual-gm-budget-2026"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
dockerfile = "sync-server.Dockerfile"

[env]
ACTUAL_PORT = "5006"
ACTUAL_HOSTNAME = "0.0.0.0"
ACTUAL_DATA_DIR = "/data"
ACTUAL_SERVER_FILES = "/data/server-files"
ACTUAL_USER_FILES = "/data/user-files"

[[mounts]]
source = "actual_data"
destination = "/data"

[http_service]
internal_port = 5006
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
